name: Validate dataset and AWAL eligibility gate
on:
  push:
    paths:
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - "docs/AWAL_TRAINING_ELIGIBILITY.md"
      - "requirements.txt"
      - ".github/workflows/validate-dataset.yml"
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - "docs/AWAL_TRAINING_ELIGIBILITY.md"
      - "requirements.txt"
      - ".github/workflows/validate-dataset.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install -r requirements.txt
      - name: Validate dataset and JSON Schemas
        run: python scripts/validate_dataset.py
      - name: Validate AWAL intake quarantine
        run: python scripts/validate_awal_candidates.py
      - name: Compile AWAL tools
        run: python -m py_compile scripts/awal_training_gate.py scripts/intake_candidate.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
