name: Validate dataset
on:
  push:
    paths: ["data/**", "scripts/validate_dataset.py", "tests/**", ".github/workflows/validate-dataset.yml"]
  pull_request:
    paths: ["data/**", "scripts/validate_dataset.py", "tests/**", ".github/workflows/validate-dataset.yml"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate dataset invariants
        run: python scripts/validate_dataset.py --sources data/sources.json
      - name: Run validator tests
        run: python -m unittest discover -s tests -v
